# TEST BRANCH ONLY - not for a PR to msys2/MINGW-packages.
# Builds the real mingw-w64-slim-simulator PKGBUILD under each MSYS2 environment,
# installs the resulting package, and runs SLiM's own self-tests.
name: slim-env-test

on:
  push:
    branches: [test-slim-ucrt64-clang64]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        msystem: [UCRT64, CLANG64]
    name: ${{ matrix.msystem }}
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: mingw-w64-slim-simulator
          persist-credentials: false

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git base-devel

      - name: Build package with makepkg-mingw
        run: |
          cd mingw-w64-slim-simulator
          export MINGW_ARCH="${MSYSTEM,,}"
          makepkg-mingw --noconfirm --noprogressbar -sCLf

      - name: Install the built package
        run: |
          cd mingw-w64-slim-simulator
          ls -la *.pkg.tar.zst
          pacman --noconfirm -U *.pkg.tar.zst
          pacman -Ql "${MINGW_PACKAGE_PREFIX}-slim-simulator"

      - name: Which C runtime and C++ library did we link against?
        run: |
          for exe in slim eidos SLiMgui; do
            echo "== ${exe}.exe"
            objdump -p "${MINGW_PREFIX}/bin/${exe}.exe" | grep "DLL Name" | sort -u
          done
          echo "== unresolved DLLs for SLiMgui (should be empty)"
          ldd "${MINGW_PREFIX}/bin/SLiMgui.exe" | grep -i "not found" || true

      - name: Version and self-tests
        run: |
          slim -v
          eidos -testEidos
          slim -testEidos
          slim -testSLiM

      - name: Toy simulation
        run: |
          cat > toy.slim <<'EOF'
          initialize() {
            initializeMutationRate(1e-7);
            initializeMutationType("m1", 0.5, "f", 0.0);
            initializeGenomicElementType("g1", m1, 1.0);
            initializeGenomicElement(g1, 0, 99999);
            initializeRecombinationRate(1e-8);
          }
          1 early() { sim.addSubpop("p1", 500); }
          200 late() { catn("mutations: " + size(sim.mutations)); sim.simulationFinished(); }
          EOF
          slim toy.slim

      - name: Upload package and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slim-${{ matrix.msystem }}
          path: |
            mingw-w64-slim-simulator/*.pkg.tar.zst
            mingw-w64-slim-simulator/*.log
